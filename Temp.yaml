      MetricTransformations:
      - MetricNamespace: !Sub "AIL/${Environment}"
        MetricName: ConnectIngestionErrors
        MetricValue: "1"
        DefaultValue: 0

  ConnectSessionErrorsFilter:
    Type: AWS::Logs::MetricFilter
    Condition: DeployApplicationServices
    DependsOn: LambdaLogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AppName}-${Environment}-interaction-stream-lambda"
      FilterPattern: '{ $.error_code = "IS-3*" }'
      MetricTransformations:
      - MetricNamespace: !Sub "AIL/${Environment}"
        MetricName: ConnectSessionErrors
        MetricValue: "1"
        DefaultValue: 0

  ConnectRedisErrorsByCodeFilter:
    Type: AWS::Logs::MetricFilter
    Condition: DeployApplicationServices
    DependsOn: LambdaLogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AppName}-${Environment}-interaction-stream-lambda"
      FilterPattern: '{ $.error_code = "IS-5*" }'
      MetricTransformations:
      - MetricNamespace: !Sub "AIL/${Environment}"
        MetricName: ConnectRedisErrorsByCode
        MetricValue: "1"
        DefaultValue: 0

  ConnectOrchestratorErrorsByCodeFilter:
    Type: AWS::Logs::MetricFilter
    Condition: DeployApplicationServices
    DependsOn: LambdaLogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AppName}-${Environment}-interaction-stream-lambda"
      FilterPattern: '{ $.error_code = "IS-6*" }'
      MetricTransformations:
      - MetricNamespace: !Sub "AIL/${Environment}"
        MetricName: ConnectOrchestratorErrorsByCode
        MetricValue: "1"
        DefaultValue: 0

  ConnectConfigAndUnexpectedErrorsFilter:
    Type: AWS::Logs::MetricFilter
    Condition: DeployApplicationServices
    DependsOn: LambdaLogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AppName}-${Environment}-interaction-stream-lambda"
      FilterPattern: '{ $.error_code = "IS-7*" || $.error_code = "IS-9*" }'
      MetricTransformations:
      - MetricNamespace: !Sub "AIL/${Environment}"
        MetricName: ConnectUnexpectedErrors
        MetricValue: "1"
        DefaultValue: 0

  # --- Lambda Metric Filters (event type) ---

  ConnectValidationErrorsFilter:
    Type: AWS::Logs::MetricFilter
    Condition: DeployApplicationServices
    DependsOn: LambdaLogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AppName}-${Environment}-interaction-stream-lambda"
      FilterPattern: '{ $.level = "ERROR" && $.event_type = "ERROR" }'
      MetricTransformations:
      - MetricNamespace: !Sub "AIL/${Environment}"
        MetricName: ConnectValidationErrors
        MetricValue: "1"
        DefaultValue: 0

  ConnectRedisErrorsFilter:
    Type: AWS::Logs::MetricFilter
    Condition: DeployApplicationServices
    DependsOn: LambdaLogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AppName}-${Environment}-interaction-stream-lambda"
      FilterPattern: '{ $.event_type = "SESSION_WRITE" && $.level = "ERROR" }'
      MetricTransformations:
      - MetricNamespace: !Sub "AIL/${Environment}"
        MetricName: ConnectRedisErrors
        MetricValue: "1"
        DefaultValue: 0

  ConnectOrchestratorErrorsFilter:
    Type: AWS::Logs::MetricFilter
    Condition: DeployApplicationServices
    DependsOn: LambdaLogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AppName}-${Environment}-interaction-stream-lambda"
      # See AgentInvocationErrorsFilter: booleans need IS FALSE, not "= false".
      FilterPattern: '{ $.event_type = "ORCHESTRATOR_INVOKE" && $.attributes.success IS FALSE }'
      MetricTransformations:
      - MetricNamespace: !Sub "AIL/${Environment}"
        MetricName: ConnectOrchestratorErrors
        MetricValue: "1"
        DefaultValue: 0

  ConnectOrchestratorLatencyFilter:
    Type: AWS::Logs::MetricFilter
    Condition: DeployApplicationServices
    DependsOn: LambdaLogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AppName}-${Environment}-interaction-stream-lambda"
      FilterPattern: '{ $.event_type = "ORCHESTRATOR_INVOKE" && $.attributes.latency_ms >= 0 }'
      MetricTransformations:
      - MetricNamespace: !Sub "AIL/${Environment}"
        MetricName: ConnectOrchestratorLatencyMs
        MetricValue: "$.attributes.latency_ms"
        DefaultValue: 0

  ConnectLambdaErrorsFilter:
    Type: AWS::Logs::MetricFilter
    Condition: DeployApplicationServices
    DependsOn: LambdaLogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AppName}-${Environment}-interaction-stream-lambda"
      FilterPattern: '{ $.level = "ERROR" }'
      MetricTransformations:
      - MetricNamespace: !Sub "AIL/${Environment}"
        MetricName: ConnectLambdaErrors
        MetricValue: "1"
        DefaultValue: 0

  # --- Alarms: AgentCore (event type) ---

  AgentErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: DeployApplicationServicesAndHasAgentCoreLogGroup
    Properties:
      AlarmName: !Sub "${AppName}-${Environment}-agent-errors"
      AlarmDescription: "Agent invocation failures exceeded threshold (§7.3: AgentErrors > 5 in 5min)"
      Namespace: !Sub "AIL/${Environment}"
      MetricName: AgentErrors
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  LLMLatencyAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: DeployApplicationServicesAndHasAgentCoreLogGroup
    Properties:
      AlarmName: !Sub "${AppName}-${Environment}-llm-latency-p95"
      AlarmDescription: "LLM call latency P95 exceeded 10s (§7.3: LLMLatencyMs p95 > 10000ms)"
      Namespace: !Sub "AIL/${Environment}"
      MetricName: LLMLatencyMs
      ExtendedStatistic: p95
      Period: 300
      EvaluationPeriods: 1
      Threshold: 10000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  LLMErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: DeployApplicationServicesAndHasAgentCoreLogGroup
    Properties:
      AlarmName: !Sub "${AppName}-${Environment}-llm-errors"
      AlarmDescription: "Bedrock LLM errors or throttling detected"
      Namespace: !Sub "AIL/${Environment}"
      MetricName: LLMErrors
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 3
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  PushFailuresAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: DeployApplicationServicesAndHasAgentCoreLogGroup
    Properties:
      AlarmName: !Sub "${AppName}-${Environment}-push-failures"
      AlarmDescription: "Push to FullServe/Helphub failing"
      Namespace: !Sub "AIL/${Environment}"
      MetricName: PushOutputErrors
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 3
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  WorkerErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: DeployApplicationServicesAndHasAgentCoreLogGroup
    Properties:
      AlarmName: !Sub "${AppName}-${Environment}-worker-errors"
      AlarmDescription: "AgentCore worker thread crashed (WorkerErrors > 0 in 1min)"
      Namespace: !Sub "AIL/${Environment}"
      MetricName: WorkerErrors
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  # --- Alarms: Lambda (event type) ---

  ConnectValidationErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: DeployApplicationServices
    DependsOn: LambdaLogGroup
    Properties:
      AlarmName: !Sub "${AppName}-${Environment}-connect-validation-errors"
      AlarmDescription: "Lambda validation errors exceeded threshold (§6.3: > 10 in 5min)"
      Namespace: !Sub "AIL/${Environment}"
      MetricName: ConnectValidationErrors
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 10
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  ConnectRedisErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: DeployApplicationServices
    DependsOn: LambdaLogGroup
    Properties:
      AlarmName: !Sub "${AppName}-${Environment}-connect-redis-errors"
      AlarmDescription: "Lambda Redis write failure detected (§6.3: > 0 in 1min)"
      Namespace: !Sub "AIL/${Environment}"
      MetricName: ConnectRedisErrors
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  ConnectOrchestratorErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: DeployApplicationServices
    DependsOn: LambdaLogGroup
    Properties:
      AlarmName: !Sub "${AppName}-${Environment}-connect-orchestrator-errors"
      AlarmDescription: "Lambda AgentCore invoke failures exceeded threshold (§6.3: > 5 in 5min)"
      Namespace: !Sub "AIL/${Environment}"
      MetricName: ConnectOrchestratorErrors
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  # --- Alarms: AgentCore error codes (AIL_ERR_XXX) with resolution steps ---

  AILAgentDispatchErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: DeployApplicationServicesAndHasAgentCoreLogGroup
    Properties:
      AlarmName: !Sub "${AppName}-${Environment}-ail-agent-dispatch-errors"
      AlarmDescription: !Sub |
        AIL_ERR_001 (AGENT_FAILURE): Agent failed with unexpected error - retriable.
        AIL_ERR_002 (DISPATCH_ERROR): Agent dispatch failed during execution - retriable.
        Resolution:
        1. Check AgentCore logs: CloudWatch > Log groups > /aws/bedrock-agentcore/runtime/colleague_assist_orchestrator_${Environment}* > filter error_code="AIL_ERR_001" OR "AIL_ERR_002"
        2. Look at attributes.agent_name to identify which agent failed
        3. Common causes: LLM returned unexpected format, tool endpoint timeout, config YAML invalid
        4. If retriable errors persist, check Bedrock model availability and Redis connectivity
      Namespace: !Sub "AIL/${Environment}"
      MetricName: AILAgentDispatchErrors
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 3
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  AILConfigRoutingErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: DeployApplicationServicesAndHasAgentCoreLogGroup
    Properties:
      AlarmName: !Sub "${AppName}-${Environment}-ail-config-routing-errors"
      AlarmDescription: !Sub |
        AIL_ERR_003 (CONFIG_LOAD_ERROR): Agent config YAML could not be loaded - non-retriable.
        AIL_ERR_006 (ROUTING_ERROR): No workflow route matched current phase + event - non-retriable.
        AIL_ERR_013 (MALFORMED_CONDITION): Workflow condition expression is invalid - non-retriable.
        Resolution:
        1. Check AgentCore logs: filter error_code="AIL_ERR_003" OR "AIL_ERR_006" OR "AIL_ERR_013"
        2. ERR_003: Verify configs/BUK/agents/*.yaml exist and are valid YAML
        3. ERR_006: Check workflow.yaml - the event+phase combo has no matching route
        4. ERR_013: Check workflow.yaml condition expressions - syntax error in condition string
      Namespace: !Sub "AIL/${Environment}"
      MetricName: AILConfigRoutingErrors
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  AILOrchestratorPushErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: DeployApplicationServicesAndHasAgentCoreLogGroup
    Properties:
      AlarmName: !Sub "${AppName}-${Environment}-ail-orchestrator-push-errors"
      AlarmDescription: !Sub |
        AIL_ERR_004 (ORCHESTRATOR_ERROR): Orchestrator invocation failed - retriable.
        AIL_ERR_007 (PUSH_FAILURE): Failed to push advisory to FullServe/Helphub - retriable.
        Resolution:
        1. Check AgentCore logs: filter error_code="AIL_ERR_004" OR "AIL_ERR_007"
        2. ERR_004: Check Redis connectivity, emit chain LPUSH, phase persistence
        3. ERR_007: Check PUSH_ENDPOINT env var, verify FullServe/Helphub is reachable
        4. If circuit breaker is OPEN, push will auto-resume after 300s cooldown
      Namespace: !Sub "AIL/${Environment}"
      MetricName: AILOrchestratorPushErrors
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 3
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  AILSessionStateErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: DeployApplicationServicesAndHasAgentCoreLogGroup
    Properties:
      AlarmName: !Sub "${AppName}-${Environment}-ail-session-state-errors"
      AlarmDescription: !Sub |
        AIL_ERR_005 (SESSION_NOT_FOUND): No session state in Redis - non-retriable.
        AIL_ERR_011 (CORRUPT_SESSION_STATE): Session state from Redis failed schema validation - non-retriable.
        AIL_ERR_012 (CORRUPT_QUEUE_ENTRY): Queue entry from Redis failed validation - non-retriable.
        Resolution:
        1. Check AgentCore logs: filter error_code="AIL_ERR_005" OR "AIL_ERR_011" OR "AIL_ERR_012"
        2. ERR_005: Session TTL expired (24h) or Lambda never wrote initial state
        3. ERR_011: Session state corrupted - possibly by non-atomic merge race condition
        4. ERR_012: Event queue entry malformed - check emit chain for serialization issues
      Namespace: !Sub "AIL/${Environment}"
      MetricName: AILSessionStateErrors
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  AILGuardrailTriggeredAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: DeployApplicationServicesAndHasAgentCoreLogGroup
    Properties:
      AlarmName: !Sub "${AppName}-${Environment}-ail-guardrail-triggered"
      AlarmDescription: !Sub |
        AIL_ERR_008 (GUARDRAIL_TRIGGERED): Bedrock content guardrail blocked the response - non-retriable.
        Resolution:
        1. Check AgentCore logs: filter error_code="AIL_ERR_008"
        2. Look at attributes.agent_name to see which agent's prompt was blocked
        3. Review guardrail config: ${AppName}-${Environment}-bedrock-guardrail in Bedrock console
        4. Common causes: customer transcript contains strong language triggering content filters
        5. If false positive, adjust guardrail filter strengths or prompt template
      Namespace: !Sub "AIL/${Environment}"
      MetricName: AILGuardrailTriggered
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 3
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  AILValidationErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: DeployApplicationServicesAndHasAgentCoreLogGroup
    Properties:
      AlarmName: !Sub "${AppName}-${Environment}-ail-validation-errors"
      AlarmDescription: !Sub |
        AIL_ERR_009 (INVALID_REQUEST): Request payload is invalid - non-retriable.
        AIL_ERR_010 (INVALID_PHASE_TRANSITION): Phase transition not permitted - non-retriable.
        Resolution:
        1. Check AgentCore logs: filter error_code="AIL_ERR_009" OR "AIL_ERR_010"
        2. ERR_009: Frontend sending bad payload - check event_category, event_action, session_id format
        3. ERR_010: Event arrived for a phase that doesn't accept it - check workflow.yaml phase routes
        4. If spike, check if frontend deployed a breaking change or workflow.yaml was updated
      Namespace: !Sub "AIL/${Environment}"
      MetricName: AILValidationErrors
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  # --- Alarms: Lambda error codes (IS-XXXX) with resolution steps ---

  ConnectIngestionErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: DeployApplicationServices
    DependsOn: LambdaLogGroup
    Properties:
      AlarmName: !Sub "${AppName}-${Environment}-connect-ingestion-errors"
      AlarmDescription: !Sub |
        IS-1001 (MALFORMED_KINESIS_PAYLOAD): Base64/JSON decode failure - non-retriable.
        IS-1002 (EMPTY_RECORD_PAYLOAD): Decoded payload was empty - non-retriable.
        IS-2001 (MISSING_CONTACT_ID): ContactId field missing - non-retriable.
        IS-2002 (UNSUPPORTED_EVENT_TYPE): EventType not in valid set - non-retriable.
        IS-2003 (MISSING_EVENT_TYPE): EventType field missing entirely - non-retriable.
        Resolution:
        1. Check Lambda logs: /aws/lambda/${AppName}-${Environment}-interaction-stream-lambda > filter error_code="IS-1*" OR "IS-2*"
        2. These are bad records from upstream (Contact Lens) - retrying won't help
        3. If spike, check Contact Lens real-time stream config or upstream schema changes
      Namespace: !Sub "AIL/${Environment}"
      MetricName: ConnectIngestionErrors
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 10
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  ConnectSessionErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: DeployApplicationServices
    DependsOn: LambdaLogGroup
    Properties:
      AlarmName: !Sub "${AppName}-${Environment}-connect-session-errors"
      AlarmDescription: !Sub |
        IS-3001 (OUT_OF_ORDER_EVENT): Session bootstrapped by non-INITIATED event - non-retriable.
        IS-3002 (DUPLICATE_INITIATED_EVENT): CONTACT_INITIATED on existing session - non-retriable.
        IS-3003 (SESSION_STATE_SCHEMA_MISMATCH): State doesn't match expected schema - non-retriable.
        Resolution:
        1. Check Lambda logs: filter error_code="IS-3*"
        2. IS-3001: Events arrived out of order - SEGMENTS before STARTED
        3. IS-3002: Duplicate STARTED event - harmless if occasional
        4. IS-3003: state_schema.json changed but existing Redis sessions have old schema
      Namespace: !Sub "AIL/${Environment}"
      MetricName: ConnectSessionErrors
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  ConnectRedisErrorsByCodeAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: DeployApplicationServices
    DependsOn: LambdaLogGroup
    Properties:
      AlarmName: !Sub "${AppName}-${Environment}-connect-redis-errors-by-code"
      AlarmDescription: !Sub |
        IS-5001 (REDIS_CONNECTION_ERROR): Cannot connect to Redis - retriable.
        IS-5002 (REDIS_TIMEOUT): Redis operation timed out - retriable.
        IS-5003 (REDIS_MERGE_FAILURE): Both atomic Lua and fallback merge failed - retriable.
        Resolution:
        1. Check Lambda logs: filter error_code="IS-5*"
        2. IS-5001: Check security group (port 6379), VPC endpoint, Redis node health
        3. IS-5002: Check ElastiCache CPU/memory metrics, connection count
        4. IS-5003: Concurrent write conflict - Lambda and AgentCore both writing to same session
        5. All retriable - Kinesis will redeliver via batchItemFailures
      Namespace: !Sub "AIL/${Environment}"
      MetricName: ConnectRedisErrorsByCode
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  ConnectOrchestratorErrorsByCodeAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: DeployApplicationServices
    DependsOn: LambdaLogGroup
    Properties:
      AlarmName: !Sub "${AppName}-${Environment}-connect-orchestrator-errors-by-code"
      AlarmDescription: !Sub |
        IS-6001 (ORCHESTRATOR_INVOCATION_FAILED): AgentCore invoke call failed - retriable.
        IS-6002 (INVALID_ORCHESTRATOR_PAYLOAD_CONTRACT): Payload doesn't match InvokeRequest - non-retriable.
        IS-6003 (INVALID_UTTERANCE_SHAPE): Utterance dict doesn't match expected shape - non-retriable.
        IS-6004 (INVALID_CATEGORIZATION_RESULT_TYPE): matched_categories not list[str] - non-retriable.
        Resolution:
        1. Check Lambda logs: filter error_code="IS-6*"
        2. IS-6001: AgentCore down - check health, VPC endpoint, SigV4 credentials
        3. IS-6002: event_category/event_action mismatch - check event_config.json
        4. IS-6003/6004: Contact Lens schema changed - check transformer.py field mapping
      Namespace: !Sub "AIL/${Environment}"
      MetricName: ConnectOrchestratorErrorsByCode
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  ConnectUnexpectedErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: DeployApplicationServices
    DependsOn: LambdaLogGroup
    Properties:
      AlarmName: !Sub "${AppName}-${Environment}-connect-unexpected-errors"
      AlarmDescription: !Sub |
        IS-7001 (CONFIG_LOAD_FAILURE): Failed to load config from S3 - retriable.
        IS-9001 (UNEXPECTED_ERROR): Unhandled exception - retriable (to avoid silent data loss).
        Resolution:
        1. Check Lambda logs: filter error_code="IS-7*" OR "IS-9*"
        2. IS-7001: S3 config bucket unreachable or config JSON invalid
        3. IS-9001: Unclassified exception - check full stack trace. Investigate and reclassify
        4. Both retriable - Kinesis will redeliver. If persistent, fix the underlying cause
      Namespace: !Sub "AIL/${Environment}"
      MetricName: ConnectUnexpectedErrors
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

Outputs:
  ArtifactsBucketName:
    Description: Static S3 bucket for Lambda deployment artifacts
    Value: !Ref ArtifactsBucket
  ArtifactsBucketArn:
    Description: ARN of the static artifacts bucket
    Value: !GetAtt ArtifactsBucket.Arn
  ArtifactsKmsKeyId:
    Description: ID of the KMS key used by the artifacts bucket
    Value: !Ref ArtifactsKmsKey
  ArtifactsKmsKeyArn:
    Description: ARN of the KMS key used by the artifacts bucket
    Value: !GetAtt ArtifactsKmsKey.Arn
  
  # ---------------------------------------------------------------------------
  # Security Groups
  # ---------------------------------------------------------------------------
  
  RedisSecurityGroupId:
    Condition: DeployApplicationServices
    Description: Redis additional security group ID.
    Value: !Ref RedisAdditionalSecurityGroup
    Export:
      Name: !Sub "${AppName}-${Environment}-redis-sg-id"

  LambdaSecurityGroupId:
    Condition: DeployApplicationServices
    Description: Lambda security group ID.
    Value: !Ref LambdaSecurityGroup
    Export:
      Name: !Sub "${AppName}-${Environment}-lambda-sg-id"

  AgentCoreSecurityGroupId:
    Condition: DeployApplicationServices
    Description: AgentCore additional security group ID.
    Value: !Ref AgentCoreAdditionalSecurityGroup
    Export:
      Name: !Sub "${AppName}-${Environment}-agentcore-sg-id"

  # ---------------------------------------------------------------------------
  # Lambda
  # ---------------------------------------------------------------------------
  LambdaFunctionName:
    Condition: DeployApplicationServices
    Description: Lambda function name.
    Value: !Ref InteractionStreamLambda
    Export:
      Name: !Sub "${AppName}-${Environment}-lambda-name"

  LambdaFunctionArn:
    Condition: DeployApplicationServices
    Description: Lambda function ARN.
    Value: !GetAtt InteractionStreamLambda.Arn
    Export:
      Name: !Sub "${AppName}-${Environment}-lambda-arn"

  LambdaLogGroupName:
    Condition: DeployApplicationServices
    Description: CloudWatch log group for the Interaction Stream Lambda.
    Value: !Ref LambdaLogGroup

  LambdaExecutionRoleArn:
    Condition: DeployApplicationServices
    Description: Lambda execution role ARN.
    Value: !GetAtt InteractionStreamLambdaExecutionRole.Arn
    Export:
      Name: !Sub "${AppName}-${Environment}-lambda-role-arn"

  # ---------------------------------------------------------------------------
  # AgentCore
  # ---------------------------------------------------------------------------
  AgentCoreExecutionRoleArn:
    Condition: DeployApplicationServices
    Description: AgentCore runtime execution role ARN.
    Value: !GetAtt AgentCoreRuntimeExecutionRole.Arn
    Export:
      Name: !Sub "${AppName}-${Environment}-agentcore-role-arn"

  # ---------------------------------------------------------------------------
  # Redis
  # ---------------------------------------------------------------------------
  RedisSecretArn:
    Condition: DeployApplicationServices
    Description: Redis auth secret ARN from Service Catalog provisioned product.
    Value: !GetAtt RedisProvisionedProduct.Outputs.CacheSecretArn
    Export:
      Name: !Sub "${AppName}-${Environment}-redis-secret-arn"

  # ---------------------------------------------------------------------------
  # Guardrail
  # ---------------------------------------------------------------------------
  GuardrailId:
    Condition: DeployApplicationServices
    Description: Bedrock Guardrail ID.
    Value: !GetAtt BedrockGuardrail.GuardrailId
    Export:
      Name: !Sub "${AppName}-${Environment}-guardrail-id"

  GuardrailVersion:
    Condition: DeployApplicationServices
    Description: Bedrock Guardrail version.
    Value: !GetAtt BedrockGuardrail.Version
    Export:
      Name: !Sub "${AppName}-${Environment}-guardrail-version"

  BedrockGuardrailKmsKeyArn:
    Condition: DeployApplicationServices
    Description: KMS key ARN for Bedrock Guardrail encryption.
    Value: !GetAtt BedrockGuardrailKmsKey.Arn
    Export:
      Name: !Sub "${AppName}-${Environment}-bedrock-guardrail-kms-arn"

  # ---------------------------------------------------------------------------
  # SQS FIFO Queue
  # ---------------------------------------------------------------------------
  SqsQueueArn:
    Condition: DeployApplicationServices
    Description: SQS FIFO queue ARN.
    Value: !GetAtt SqsFifoQueue.Arn
    Export:
      Name: !Sub "${AppName}-${Environment}-sqs-queue-arn"

  SqsQueueUrl:
    Condition: DeployApplicationServices
    Description: SQS FIFO queue URL.
    Value: !Ref SqsFifoQueue
    Export:
      Name: !Sub "${AppName}-${Environment}-sqs-queue-url"

  SqsDLQArn:
    Condition: DeployApplicationServices
    Description: SQS FIFO dead-letter queue ARN.
    Value: !GetAtt SqsDeadLetterQueue.Arn
    Export:
      Name: !Sub "${AppName}-${Environment}-sqs-dlq-arn"

  ForwarderRoleArn:
    Condition: DeployApplicationServicesAndHasCrossAccountForwarder
    Description: Cross-account IAM role ARN for the SQS forwarder Lambda to assume.
    Value: !GetAtt SqsForwarderCrossAccountRole.Arn
    Export:
      Name: !Sub "${AppName}-${Environment}-sqs-forwarder-role-arn"

  # ---------------------------------------------------------------------------
  # Common Config
  # ---------------------------------------------------------------------------
  CommonConfigParameterPath:
    Condition: DeployApplicationServices
    Description: SSM parameter path for common config (push endpoints, TIAA auth, circuit breaker).
    Value: !Sub "/ail/${Environment}/network/common/config"
    Export:
      Name: !Sub "${AppName}-${Environment}-common-config-path"
