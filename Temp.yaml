  # ---------------------------------------------------------------------------
  # CloudWatch Alarms — SQS DLQ monitoring
  # ---------------------------------------------------------------------------
  DLQDepthAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: DeployApplicationServices
    DependsOn:
    - SqsDeadLetterQueue
    Properties:
      AlarmName: !Sub "${AppName}-${Environment}-sqs-dlq-depth"
      AlarmDescription: "Messages landed in the DLQ — investigate failed records."
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
      - Name: QueueName
        Value: !GetAtt SqsDeadLetterQueue.QueueName
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  MessageAgeAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: DeployApplicationServices
    DependsOn:
    - SqsFifoQueue
    Properties:
      AlarmName: !Sub "${AppName}-${Environment}-sqs-message-age"
      AlarmDescription: "Oldest message in queue exceeds 5 minutes — possible processing stall."
      Namespace: AWS/SQS
      MetricName: ApproximateAgeOfOldestMessage
      Dimensions:
      - Name: QueueName
        Value: !GetAtt SqsFifoQueue.QueueName
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 300
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

