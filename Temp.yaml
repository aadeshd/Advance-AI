    Condition: DeployApplicationServices
    Properties:
      Name: !Sub "/ail/${Environment}/guardrail/id"
      Type: String
      Value: !GetAtt BedrockGuardrail.GuardrailId
      Description: !Sub "Bedrock Guardrail ID for ${AppName}-${Environment}."
      Tags:
        Application: !Ref AppName
        Environment: !Ref Environment

  GuardrailVersionSsmParameter:
    Type: AWS::SSM::Parameter
    Condition: DeployApplicationServices
    Properties:
      Name: !Sub "/ail/${Environment}/guardrail/version"
      Type: String
      Value: !GetAtt BedrockGuardrail.Version
      Description: !Sub "Bedrock Guardrail version for ${AppName}-${Environment}."
      Tags:
        Application: !Ref AppName
        Environment: !Ref Environment

  GuardrailKmsKeyArnSsmParameter:
    Type: AWS::SSM::Parameter
    Condition: DeployApplicationServices
    Properties:
      Name: !Sub "/ail/${Environment}/kms/bedrock-guardrail/key-arn"
      Type: String
      Value: !GetAtt BedrockGuardrailKmsKey.Arn
      Description: !Sub "KMS key ARN for Bedrock Guardrail encryption - ${AppName}-${Environment}."
      Tags:
        Application: !Ref AppName
        Environment: !Ref Environment

  # ---------------------------------------------------------------------------
  # Security Group IDs stored in SSM Parameter Store
  # ---------------------------------------------------------------------------
  AgentCoreSecurityGroupIdParameter:
    Type: AWS::SSM::Parameter
    Condition: DeployApplicationServices
    Properties:
      Name: !Sub "/ail/${Environment}/network/agentcore/additional-sg"
      Type: String
      Value: !Ref AgentCoreAdditionalSecurityGroup
      Description: !Sub "AgentCore additional security group ID for ${AppName}-${Environment}."
      Tags:
        Application: !Ref AppName
        Environment: !Ref Environment

  LambdaSecurityGroupIdParameter:
    Type: AWS::SSM::Parameter
    Condition: DeployApplicationServices
    Properties:
      Name: !Sub "/ail/${Environment}/network/lambda/additional-sg"
      Type: String
      Value: !Ref LambdaSecurityGroup
      Description: !Sub "Lambda security group ID for ${AppName}-${Environment}."
      Tags:
        Application: !Ref AppName
        Environment: !Ref Environment

  RedisSecurityGroupIdParameter:
    Type: AWS::SSM::Parameter
    Condition: DeployApplicationServices
    Properties:
      Name: !Sub "/ail/${Environment}/network/redis/additional-sg"
      Type: String
      Value: !Ref RedisAdditionalSecurityGroup
      Description: !Sub "Redis additional security group ID for ${AppName}-${Environment}."
      Tags:
        Application: !Ref AppName
        Environment: !Ref Environment

  AgentCoreExecutionRoleArnParameter:
    Type: AWS::SSM::Parameter
    Condition: DeployApplicationServices
    Properties:
      Name: !Sub "/ail/${Environment}/network/agentcore/execution-role"
      Type: String
      Value: !GetAtt AgentCoreRuntimeExecutionRole.Arn
      Description: !Sub "AgentCore runtime execution role ARN for ${AppName}-${Environment}."
      Tags:
        Application: !Ref AppName
        Environment: !Ref Environment

  # ---------------------------------------------------------------------------
  # Lambda IAM role for normal CloudFormation-created Lambda
  # ---------------------------------------------------------------------------
  InteractionStreamLambdaExecutionRole:
    Type: AWS::IAM::Role
    Condition: DeployApplicationServices
    Properties:
      RoleName: !Sub "svc-${AppName}-${Environment}-lambda-role"
      PermissionsBoundary: !If [HasPermissionsBoundary, !Ref PermissionsBoundaryArn, !Ref "AWS::NoValue"]
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
        - Effect: Allow
          Principal:
            Service: lambda.amazonaws.com
          Action: sts:AssumeRole
      ManagedPolicyArns:
        # Plan.md 6.1 - AWSLambdaBasicExecutionRole REMOVED. It granted
        # logs:CreateLogGroup on "*", letting the runtime auto-create an
        # ungoverned log group (no retention/tags/encryption). Its CreateLogStream
        # and PutLogEvents grants are replaced by the scoped WriteLogs Sid below.
        # AWSLambdaVPCAccessExecutionRole is retained - required for ENI management.
      - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
      - PolicyName: SQSReadAccess
        PolicyDocument:
          Version: "2012-10-17"
          Statement:
          - Sid: SQSConsumeMessages
            Effect: Allow
            Action:
            - sqs:ReceiveMessage
            - sqs:DeleteMessage
            - sqs:GetQueueAttributes
            - sqs:ChangeMessageVisibility
            Resource: !GetAtt SqsFifoQueue.Arn
          - Sid: SQSKMSDecrypt
            Effect: Allow
            Action:
            - kms:Decrypt
            - kms:GenerateDataKey
            Resource: !GetAtt SqsKmsKey.Arn

      # Logging kept in its own policy so the intent is obvious. CreateLogGroup
      # is deliberately NOT granted: LambdaLogGroup owns creation, retention,
      # tagging and deletion policy, and a runtime-created group would be ungoverned.
      - PolicyName: LogsAndTracing
        PolicyDocument:
          Version: "2012-10-17"
          Statement:
          - Sid: WriteLogs
            Effect: Allow
            Action:
            - logs:CreateLogStream
            - logs:PutLogEvents
            Resource:
            - !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AppName}-${Environment}-interaction-stream-lambda:*"
          # The function sets Tracing: Active. Because the role is supplied
          # explicitly, SAM does not attach AWSXRayDaemonWriteAccess for us and
          # AWSLambdaVPCAccessExecutionRole does not include X-Ray either, so
          # without this block tracing is enabled but silently emits nothing.
          - Sid: XRayTracing
            Effect: Allow
            Action:
            - xray:PutTraceSegments
            - xray:PutTelemetryRecords
            Resource: "*"

      - PolicyName: InvokeAgentCoreRuntime
        PolicyDocument:
          Version: "2012-10-17"
          Statement:
          - Sid: InvokeAgentRuntime
            Effect: Allow
            Action:
            - bedrock-agentcore:InvokeAgentRuntime
            Resource:
            - !Sub "arn:aws:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:runtime/*"

          - Sid: StopAgentCoreSession
            Effect: Allow
            Action:
            - bedrock-agentcore:StopRuntimeSession
            Resource:
            - !Sub "arn:aws:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:runtime/*"

      # S3ReadPolicy removed: it granted s3:GetObject on "ail-assist-artifacts-*"
      # across every environment and account-suffix in the region. The
      # ArtifactsBucketReadAndDecrypt policy below covers the same need scoped to
      # this environment's bucket only.
      - PolicyName: SSMReadPolicy
        PolicyDocument:
          Version: "2012-10-17"
          Statement:
          - Sid: SSMParameterRead
            Effect: Allow
            Action:
            - ssm:GetParameter
            - ssm:GetParameters
            - ssm:GetParametersByPath
            Resource:
            # Scoped to this environment: a sit Lambda has no reason to read
            # /ail/prod/ parameters.
            - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/ail/${Environment}/*"

      - PolicyName: SecretsManagerReadPolicy
        PolicyDocument:
          Version: "2012-10-17"
          Statement:
          - Sid: SecretsManagerAccess
            Effect: Allow
            Action:
            - secretsmanager:GetSecretValue
            Resource:
                  # Scoped to Redis auth secret only (C1 fix — was secret:*)
            - !GetAtt RedisProvisionedProduct.Outputs.CacheSecretArn

      - PolicyName: KMSDecryptPolicy
        PolicyDocument:
          Version: "2012-10-17"
          Statement:
          - Sid: KMSDecryptBedrockGuardrail
            Effect: Allow
            Action:
            - kms:Decrypt
            Resource:
                  # Scoped to Bedrock Guardrail KMS key only (C2 fix — was key/*)
            - !GetAtt BedrockGuardrailKmsKey.Arn
          - Sid: KMSDecryptViaSecretsManager
            Effect: Allow
            Action:
            - kms:Decrypt
            - kms:DescribeKey
            Resource:
                  # Allow decrypt for any key, but ONLY when accessed through
                  # Secrets Manager (covers Redis secret's encryption key which
                  # is created by the Service Catalog product — ARN not available here)
            - !Sub "arn:aws:kms:${AWS::Region}:${AWS::AccountId}:key/*"
            Condition:
              StringEquals:
                kms:ViaService: !Sub "secretsmanager.${AWS::Region}.amazonaws.com"
      - PolicyName: ArtifactsBucketReadAndDecrypt
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Sid: ReadStaticArtifactsBucket
            Effect: Allow
            Action:
            - s3:ListBucket
            Resource: !Sub "arn:aws:s3:::ail-assist-artifacts-${Environment}-${AWS::AccountId}"
          - Sid: ReadStaticArtifactsObjects
            Effect: Allow
            Action:
            - s3:GetObject
            - s3:GetObjectVersion
            Resource: !Sub "arn:aws:s3:::ail-assist-artifacts-${Environment}-${AWS::AccountId}/*"
          - Sid: DecryptArtifacts
            Effect: Allow
            Action:
            - kms:Decrypt
            - kms:DescribeKey
            Resource: !GetAtt ArtifactsKmsKey.Arn
      Tags:
      - Key: Application
        Value: !Ref AppName
      - Key: Environment
        Value: !Ref Environment

  # ---------------------------------------------------------------------------
  # Plan.md 6.1 - governed Lambda log group.
  # Pre-created so retention, tags and deletion policy are owned by IaC instead
  # of the Lambda runtime auto-creating an ungoverned group on first invocation.
  # The name MUST be exactly /aws/lambda/<FunctionName>; if it drifts from the
  # FunctionName below, Lambda ignores this group and silently creates its own.
  # ---------------------------------------------------------------------------
  LambdaLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: DeployApplicationServices
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AppName}-${Environment}-interaction-stream-lambda"
      RetentionInDays: !Ref LogRetentionInDays
      Tags:
      - Key: Team
        Value: CDAO
      - Key: Service
        Value: AIL-ColleagueAssist
      - Key: Application
        Value: !Ref AppName
      - Key: Environment
        Value: !Ref Environment

  # ---------------------------------------------------------------------------
  # Normal Lambda function created directly by CloudFormation
  # ---------------------------------------------------------------------------
  InteractionStreamLambda:
    Type: AWS::Serverless::Function
    Condition: DeployApplicationServices
    DependsOn:
    - LambdaSecurityGroup
    - InteractionStreamLambdaExecutionRole
    - LambdaLogGroup
    - RedisProvisionedProduct
    Properties:
      FunctionName: !Sub "${AppName}-${Environment}-interaction-stream-lambda"
      Description: !Ref LambdaDescription
      CodeUri: ./src/connect_adapter/
      # CodeUri:
      #   Bucket: !Ref LambdaS3BucketName
      #   Key: !Ref LambdaCodeKeyName
      Runtime: !Ref LambdaRuntime
      Handler: !Ref LambdaHandler
      Role: !GetAtt InteractionStreamLambdaExecutionRole.Arn
      Timeout: !Ref LambdaTimeout
      MemorySize: !Ref LambdaMemorySize
      Architectures:
      - !Ref LambdaArchitecture
      Tracing: !Ref LambdaTracing
      VpcConfig:
        SecurityGroupIds:
        - !Ref LambdaSecurityGroup
        SubnetIds:
        - !Ref LambdaSubnet1
        - !Ref LambdaSubnet2
      Environment:
        Variables:
          AWS_ACCOUNT_ID: !Sub "${AWS::AccountId}"
          TARGET_AWS_REGION: !Sub "${AWS::Region}"
          REDIS_CONFIG_VAR: !Ref RedisVarName
          AGENTCORE_CONFIG_VAR: !Ref AgentCoreVarName
          COMMON_CONFIG_VAR: !Sub "/ail/${Environment}/network/common/config"
          CONNECT_TIMEOUT: !Sub "${ConnectTimeoutSeconds}"
          REDIS_SECRET_ARN: !GetAtt RedisProvisionedProduct.Outputs.CacheSecretArn
          SESSION_TTL_SECONDS: !Sub "${SessionTtlSeconds}"
          SOCKET_TIMEOUT: !Sub "${SocketTimeoutSeconds}"
      Tags:
        Application: !Ref AppName
        Environment: !Ref Environment

  # ---------------------------------------------------------------------------
  # Connectivity: allow Lambda SG into Redis SG on Redis port
  # ---------------------------------------------------------------------------
  RedisIngressFromLambda:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: DeployApplicationServices
    Properties:
      GroupId: !Ref RedisAdditionalSecurityGroup
      IpProtocol: tcp
      FromPort: !Ref RedisPort
      ToPort: !Ref RedisPort
      SourceSecurityGroupId: !Ref LambdaSecurityGroup
      Description: !Sub "Allow Lambda to Redis on port ${RedisPort}"

  RedisIngressFromAgentCore:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: DeployApplicationServices
    Properties:
      GroupId: !Ref RedisAdditionalSecurityGroup
      IpProtocol: tcp
      FromPort: !Ref RedisPort
      ToPort: !Ref RedisPort
      SourceSecurityGroupId: !Ref AgentCoreAdditionalSecurityGroup
      Description: !Sub "Allow AgentCore to Redis on port ${RedisPort}"

  AgentCoreIngressFromLambda:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: DeployApplicationServices
    Properties:
      GroupId: !Ref AgentCoreAdditionalSecurityGroup
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      SourceSecurityGroupId: !Ref LambdaSecurityGroup
      Description: !Sub "Allow Lambda to invoke AgentCore on port 443"


  # ---------------------------------------------------------------------------
  # Redis Service Catalog product
  # ---------------------------------------------------------------------------
  RedisProvisionedProduct:
    Type: AWS::ServiceCatalog::CloudFormationProvisionedProduct
    Condition: DeployApplicationServices
    DependsOn:
    - RedisAdditionalSecurityGroup
    Properties:
      ProductId: !Ref RedisProductId
      ProvisioningArtifactId: !Ref RedisProvisioningArtifactId
      ProvisionedProductName: !Sub "${AppName}-${Environment}-redis"
      ProvisioningParameters:
      - Key: FriendlyStackName
        Value: !Sub "ail-${Environment}-redis"
      - Key: CacheNodeType
        Value: !Ref RedisCacheNodeType
      - Key: EngineVersion
        Value: !Ref RedisEngineVersion
      - Key: RedisPort
        Value: !Ref RedisPort
      - Key: NumNodeGroups
        Value: !Ref RedisNumNodeGroups
      - Key: ReplicasPerNodeGroup
        Value: !Ref RedisReplicasPerNodeGroup
      - Key: MultiAZEnabled
        Value: !Ref RedisMultiAZEnabled
      - Key: SnapshotRetentionLimit
        Value: !Ref RedisSnapshotRetentionLimit
      - Key: AdditionalSG
        Value: !Ref RedisAdditionalSecurityGroup
      - Key: Subnet1
        Value: !Ref ElastiCacheSubnet1
      - Key: Subnet2
        Value: !Ref ElastiCacheSubnet2
      - Key: Subnet3
        Value: !Ref ElastiCacheSubnet1
      - Key: VpcId
        Value: !Ref VpcIdPath
      - Key: LogFormat
        Value: !Ref RedisLogFormat
      - Key: LogType
        Value: !Ref RedisLogType
      - Key: LogRetentionDays
        Value: !Ref RedisLogRetentionDays
      - Key: CacheLogsEnabled
        Value: !Ref RedisCacheLogsEnabled
      Tags:
      - Key: Application
        Value: !Ref AppName
      - Key: Environment
        Value: !Ref Environment

  # ---------------------------------------------------------------------------
  # SQS FIFO queue — KMS encryption key
  # ---------------------------------------------------------------------------
  SqsKmsKey:
    Type: AWS::KMS::Key
    Condition: DeployApplicationServices
    Properties:
      Description: !Sub "KMS key for ${AppName}-${Environment} SQS FIFO queue encryption"
      EnableKeyRotation: true
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
        - Sid: EnableRootAccount
          Effect: Allow
          Principal:
            AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root"
          Action: kms:*
          Resource: "*"
      Tags:
      - Key: Application
        Value: !Ref AppName
      - Key: Environment
        Value: !Ref Environment

  SqsKmsKeyAlias:
    Type: AWS::KMS::Alias
    Condition: DeployApplicationServices
    Properties:
      AliasName: !Sub "alias/${AppName}-sqs-${Environment}"
      TargetKeyId: !Ref SqsKmsKey

  # ---------------------------------------------------------------------------
  # SQS FIFO queue — dead-letter queue + main queue
  # ---------------------------------------------------------------------------
  SqsDeadLetterQueue:
    Type: AWS::SQS::Queue
    Condition: DeployApplicationServices
    Properties:
      QueueName: !Sub "${AppName}-${Environment}-sqs-dlq.fifo"
      FifoQueue: true
      MessageRetentionPeriod: 1209600
      KmsMasterKeyId: !GetAtt SqsKmsKey.Arn
      KmsDataKeyReusePeriodSeconds: 300
      Tags:
      - Key: Application
        Value: !Ref AppName
      - Key: Environment
        Value: !Ref Environment

  SqsFifoQueue:
    Type: AWS::SQS::Queue
    Condition: DeployApplicationServices
    Properties:
      QueueName: !Sub "${AppName}-${Environment}-sqs.fifo"
      FifoQueue: true
      VisibilityTimeout: 360
      MessageRetentionPeriod: 345600
      ContentBasedDeduplication: false
      ReceiveMessageWaitTimeSeconds: 20
      DelaySeconds: 0
      MaximumMessageSize: 262144
      KmsMasterKeyId: !GetAtt SqsKmsKey.Arn
      KmsDataKeyReusePeriodSeconds: 300
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt SqsDeadLetterQueue.Arn
        maxReceiveCount: 3
      Tags:
      - Key: Application
        Value: !Ref AppName
      - Key: Environment
        Value: !Ref Environment

  # ---------------------------------------------------------------------------
  # Cross-account IAM role for SQS forwarder Lambda (conditional)
  # ---------------------------------------------------------------------------
  SqsForwarderCrossAccountRole:
    Type: AWS::IAM::Role
    Condition: DeployApplicationServicesAndHasCrossAccountForwarder
    Properties:
      RoleName: !Sub "svc-${AppName}-${Environment}-ve-sqs-forwarder-role"
      PermissionsBoundary: !If [HasPermissionsBoundary, !Ref PermissionsBoundaryArn, !Ref "AWS::NoValue"]
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
        - Effect: Allow
          Principal:
            AWS: !Ref SourceAccountForwarderRoleArn
          Action: sts:AssumeRole
      Policies:
      - PolicyName: SqsSendAccess
        PolicyDocument:
          Version: "2012-10-17"
          Statement:
          - Sid: SQSSendMessages
            Effect: Allow
            Action:
            - sqs:SendMessage
            - sqs:GetQueueAttributes
            - sqs:GetQueueUrl
            Resource: !GetAtt SqsFifoQueue.Arn
          - Sid: KMSEncryptForSQS
            Effect: Allow
            Action:
            - kms:GenerateDataKey
            - kms:Decrypt
            Resource: !GetAtt SqsKmsKey.Arn
      Tags:
      - Key: Application
        Value: !Ref AppName
      - Key: Environment
        Value: !Ref Environment

  # ---------------------------------------------------------------------------
  # SQS FIFO event source mapping on Lambda
  # ---------------------------------------------------------------------------
  SQSEventSourceMapping:
    Type: AWS::Lambda::EventSourceMapping
    Condition: DeployApplicationServices
    DependsOn:
    - InteractionStreamLambda
    - InteractionStreamLambdaExecutionRole
    - SqsFifoQueue
    Properties:
      EventSourceArn: !GetAtt SqsFifoQueue.Arn
      FunctionName: !GetAtt InteractionStreamLambda.Arn
      BatchSize: 10
      FunctionResponseTypes:
      - ReportBatchItemFailures
      ScalingConfig:
        MaximumConcurrency: 10
      Enabled: true

  # ---------------------------------------------------------------------------
  # SSM Parameters — connection config created after infra is provisioned
  # ---------------------------------------------------------------------------
  RedisConfigParameter:
    Type: AWS::SSM::Parameter
    Condition: DeployApplicationServices
    DependsOn:
    - RedisProvisionedProduct
    Properties:
      Name: !Ref RedisVarName
      Type: String
      Value: !Sub
      - |
        {
          "host": "${RedisEndpoint}",
          "port": 6379,
          "ssl": true,
          "redis_url": "redis://${RedisEndpoint}:6379",
          "primary_endpoint": "${RedisEndpoint}",
          "redis_tls": "true",
          "auth_secret_arn": "${RedisSecretArn}"
        }
      - RedisEndpoint: !GetAtt RedisProvisionedProduct.Outputs.CachePrimaryEndPointAddress
        RedisSecretArn: !GetAtt RedisProvisionedProduct.Outputs.CacheSecretArn
      Description: !Sub "Redis connection config for ${AppName}-${Environment} Lambda."
      Tags:
        Application: !Ref AppName
        Environment: !Ref Environment

  AgentCoreConfigParameter:
    Type: AWS::SSM::Parameter
    Condition: DeployApplicationServices
    Properties:
      Name: !Ref AgentCoreVarName
      Type: String
      Value: !Sub
      - |
        {
          "product_holdings_url": "https://zuul-gateway-pt-a-25960.np4.apaas4.barclays.intranet/cct-semantic-mediation-api/1/sml/v1/complaintevents/RETRIEVE_PRODUCT",
          "pcr_l1_segment_url": "https://zuul-gateway-pt-a-25960.np4.apaas4.barclays.intranet/cct-semantic-mediation-api/1/sml/v1/complaintevents/RETRIEVE_PCR",
          "api_gateway_host": "t7kghpblwg.execute-api.us-east-1.amazonaws.com",
