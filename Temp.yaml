  # ===========================================================================
  # Application-Level Monitoring - Metric Filters & Alarms
  # Aligned with colleague-assist-log-approach-v2.md (§7.2-7.3)
  # and connect-adapter-log-approach-v2.md (§6.2-6.3).
  # 24 metric filters + 19 CloudWatch alarms on structured log events.
  # Infrastructure alarms (Redis, Kinesis, ALB) are owned by the infra team.
  # ===========================================================================

  # --- AgentCore Metric Filters (event type) ---

  AgentInvocationErrorsFilter:
    Type: AWS::Logs::MetricFilter
    Condition: DeployApplicationServicesAndHasAgentCoreLogGroup
    Properties:
      LogGroupName: !Ref AgentCoreLogGroupName
      # CloudWatch JSON filter patterns compare booleans with IS TRUE / IS FALSE.
      # "= false" never matches and the metric stays silently at zero.
      FilterPattern: '{ $.event_type = "AGENT_INVOCATION" && $.attributes.success IS FALSE }'
      MetricTransformations:
      - MetricNamespace: !Sub "AIL/${Environment}"
        MetricName: AgentErrors
        MetricValue: "1"
        DefaultValue: 0

  LLMLatencyFilter:
    Type: AWS::Logs::MetricFilter
    Condition: DeployApplicationServicesAndHasAgentCoreLogGroup
    Properties:
      LogGroupName: !Ref AgentCoreLogGroupName
      FilterPattern: '{ $.event_type = "LLM_CALL" && $.attributes.latency_ms >= 0 }'
      MetricTransformations:
      - MetricNamespace: !Sub "AIL/${Environment}"
        MetricName: LLMLatencyMs
        MetricValue: "$.attributes.latency_ms"
        DefaultValue: 0

  LLMTokenUsageFilter:
    Type: AWS::Logs::MetricFilter
    Condition: DeployApplicationServicesAndHasAgentCoreLogGroup
    Properties:
      LogGroupName: !Ref AgentCoreLogGroupName
      FilterPattern: '{ $.event_type = "LLM_CALL" && $.attributes.total_tokens > 0 }'
      MetricTransformations:
      - MetricNamespace: !Sub "AIL/${Environment}"
        MetricName: LLMTokensUsed
        MetricValue: "$.attributes.total_tokens"
        DefaultValue: 0

  WorkerErrorsFilter:
    Type: AWS::Logs::MetricFilter
    Condition: DeployApplicationServicesAndHasAgentCoreLogGroup
    Properties:
      LogGroupName: !Ref AgentCoreLogGroupName
      FilterPattern: '{ $.event_type = "WORKER_LIFECYCLE" && $.attributes.action = "error" }'
      MetricTransformations:
      - MetricNamespace: !Sub "AIL/${Environment}"
        MetricName: WorkerErrors
        MetricValue: "1"
        DefaultValue: 0

  QueueEnqueuesFilter:
    Type: AWS::Logs::MetricFilter
    Condition: DeployApplicationServicesAndHasAgentCoreLogGroup
    Properties:
      LogGroupName: !Ref AgentCoreLogGroupName
      FilterPattern: '{ $.event_type = "QUEUE_ENQUEUE" }'
      MetricTransformations:
      - MetricNamespace: !Sub "AIL/${Environment}"
        MetricName: QueueEnqueues
        MetricValue: "1"
        DefaultValue: 0

  PriorityInterruptsFilter:
    Type: AWS::Logs::MetricFilter
    Condition: DeployApplicationServicesAndHasAgentCoreLogGroup
    Properties:
      LogGroupName: !Ref AgentCoreLogGroupName
      FilterPattern: '{ $.event_type = "PRIORITY_INTERRUPT" }'
      MetricTransformations:
      - MetricNamespace: !Sub "AIL/${Environment}"
        MetricName: PriorityInterrupts
        MetricValue: "1"
        DefaultValue: 0

  LLMErrorsFilter:
    Type: AWS::Logs::MetricFilter
    Condition: DeployApplicationServicesAndHasAgentCoreLogGroup
    Properties:
      LogGroupName: !Ref AgentCoreLogGroupName
      FilterPattern: '{ $.event_type = "LLM_CALL" && $.level = "ERROR" }'
      MetricTransformations:
      - MetricNamespace: !Sub "AIL/${Environment}"
        MetricName: LLMErrors
        MetricValue: "1"
        DefaultValue: 0

  PushOutputErrorsFilter:
    Type: AWS::Logs::MetricFilter
    Condition: DeployApplicationServicesAndHasAgentCoreLogGroup
    Properties:
      LogGroupName: !Ref AgentCoreLogGroupName
      FilterPattern: '{ $.event_type = "PUSH_OUTPUT" && $.level = "ERROR" }'
      MetricTransformations:
      - MetricNamespace: !Sub "AIL/${Environment}"
        MetricName: PushOutputErrors
        MetricValue: "1"
        DefaultValue: 0

  # --- AgentCore Metric Filters (AIL_ERR_XXX error codes) ---

  AILAgentDispatchErrorsFilter:
    Type: AWS::Logs::MetricFilter
    Condition: DeployApplicationServicesAndHasAgentCoreLogGroup
    Properties:
      LogGroupName: !Ref AgentCoreLogGroupName
      FilterPattern: '{ $.error_code = "AIL_ERR_001" || $.error_code = "AIL_ERR_002" }'
