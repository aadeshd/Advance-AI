        MetricValue: "1"
        DefaultValue: 0

  AILGuardrailTriggeredFilter:
    Type: AWS::Logs::MetricFilter
    Condition: DeployApplicationServicesAndHasAgentCoreLogGroup
    Properties:
      LogGroupName: !Ref AgentCoreLogGroupName
      FilterPattern: '{ $.error_code = "AIL_ERR_008" }'
      MetricTransformations:
      - MetricNamespace: !Sub "AIL/${Environment}"
        MetricName: AILGuardrailTriggered
        MetricValue: "1"
        DefaultValue: 0

  AILValidationErrorsFilter:
    Type: AWS::Logs::MetricFilter
    Condition: DeployApplicationServicesAndHasAgentCoreLogGroup
    Properties:
      LogGroupName: !Ref AgentCoreLogGroupName
      FilterPattern: '{ $.error_code = "AIL_ERR_009" || $.error_code = "AIL_ERR_010" }'
      MetricTransformations:
      - MetricNamespace: !Sub "AIL/${Environment}"
        MetricName: AILValidationErrors
        MetricValue: "1"
