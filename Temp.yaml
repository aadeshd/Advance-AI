# Deploy commands: see deployments/DEPLOYMENT-HISTORY.md
# Template standards: see deployments/TEMPLATE-STANDARDS.md
#
# =============================================================================
# DEPLOYMENT — two passes against the SAME stack
# =============================================================================
# This template is ~95 KB. CloudFormation only accepts 51,200 bytes inline, so
# it MUST be staged through S3. Plain `aws cloudformation deploy --template-file`
# sends the body inline and fails with "template body is too large"; it also
# cannot resolve the Lambda CodeUri local path. Use `sam deploy`, which uploads
# both the template and the packaged code.
#
# Shared parameter block (adjust per environment):
#
#   PARAMS="AppName=ail-assist Environment=sit \
#     PermissionsBoundaryArn=arn:aws:iam::<acct>:policy/core-ServiceRolePermissionsBoundary \
#     VpcIdValue=/app/network/VPCId VpcIdPath=/app/network/VPCId \
#     VpcCidrValue=/app/network/VPCCidr \
#     LambdaSubnet1=/ail/network/vpce/subneta LambdaSubnet2=/ail/network/vpce/subnetb \
#     ElastiCacheSubnet1=/ail/network/vpce/subneta ElastiCacheSubnet2=/ail/network/vpce/subnetb \
#     RedisProductId=prod-xxxx RedisProvisioningArtifactId=pa-xxxx \
#     RedisVarName=/ail/sit/network/redis/config \
#     AgentCoreVarName=/ail/sit/network/agentcore/config"
#
# PASS 1 — create the artifacts bucket + KMS key only:
#   sam deploy --stack-name ail-assist-sit --template-file template.yaml \
#     --resolve-s3 --parameter-overrides $PARAMS DeploymentMode=BucketOnly \
#     --capabilities CAPABILITY_NAMED_IAM --region eu-central-1 --profile sitprofile
#
# PASS 2 — same stack, now create every application service:
#   sam build
#   sam deploy --stack-name ail-assist-sit --template-file template.yaml \
#     --s3-bucket ail-assist-artifacts-sit-<acct> --s3-prefix lambda/interaction-stream \
#     --parameter-overrides $PARAMS DeploymentMode=FullCreateBucket \
#     --capabilities CAPABILITY_NAMED_IAM --region eu-central-1 --profile sitprofile
#
# NOTE: KinesisStreamArn appeared in the old commands but is not a parameter of
# this template — passing it now fails validation. The Lambda is fed by SQS.
# NOTE: LambdaS3BucketName / LambdaCodeKeyName are intentionally retained but
# unreferenced; they exist only for the manual/console deployment path where the
# commented-out CodeUri block under InteractionStreamLambda is swapped back in.
# =============================================================================
AWSTemplateFormatVersion: "2010-09-09"
Transform: "AWS::Serverless-2016-10-31"
Description: >-
  Colleague Assist backend infrastructure plus the static S3 artifacts bucket and its KMS key.

  DeploymentMode controls bootstrap behaviour: BucketOnly creates only the artifacts bucket/KMS key;
  FullCreateBucket creates the bucket/KMS key plus all application services.
  Deploy BucketOnly first, upload the Lambda artifact, then redeploy the same stack as FullCreateBucket.

Parameters:
  # ---------------------------------------------------------------------------
  # Core identifiers (REQUIRED — no defaults, differ per environment/account)
  # ---------------------------------------------------------------------------
  DeploymentMode:
    Type: String
    Default: BucketOnly
    AllowedValues:
    - BucketOnly
    - FullCreateBucket
    Description: >-
      BucketOnly = create only the static artifacts bucket and its KMS key (bootstrap pass).
      FullCreateBucket = keep that bucket/KMS key and additionally create all application services.
  AppName:
    Type: String
    Default: ail-assist
    Description: Application name used as naming prefix.

  Environment:
    Type: String
    AllowedValues:
    - dev
    - sit
    - uat
    - prod
    - tmp
    Description: Deployment environment.

  PermissionsBoundaryArn:
    Type: String
    Default: ""
    Description: Permissions boundary ARN required by organisation governance.

  # ---------------------------------------------------------------------------
  # Network (REQUIRED — differ per account/environment)
  # ---------------------------------------------------------------------------
  VpcIdValue:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::VPC::Id>
    Default: /app/network/VPCId
    Description: SSM path that resolves to VPC ID for security groups.

  VpcIdPath:
    Type: String
    Default: /app/network/VPCId
    Description: SSM path for VPC ID (passed as-is to Service Catalog Redis product).

  VpcCidrValue:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /app/network/VPCCidr
    Description: SSM path that resolves to VPC CIDR for security group egress rules.

  LambdaSubnet1:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Subnet::Id>
    Description: SSM path that resolves to Lambda subnet 1.

  LambdaSubnet2:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Subnet::Id>
    Description: SSM path that resolves to Lambda subnet 2.

  ElastiCacheSubnet1:
    Type: String
    Description: SSM parameter path for Redis subnet 1 (passed as-is to Service Catalog product).

  ElastiCacheSubnet2:
    Type: String
    Description: SSM parameter path for Redis subnet 2 (passed as-is to Service Catalog product).

  # ---------------------------------------------------------------------------
  # Redis (REQUIRED — Service Catalog IDs differ per account)
  # ---------------------------------------------------------------------------
  RedisProductId:
    Type: String
    Description: Service Catalog product ID for ElastiCache Redis.

  RedisProvisioningArtifactId:
    Type: String
    Description: Service Catalog provisioning artifact ID for Redis.

  # Redis config (safe defaults — same across environments)
  RedisPort:
    Type: Number
    Default: 6379

  RedisCacheNodeType:
    Type: String
    Default: cache.t3.small

  RedisEngineVersion:
    Type: String
    Default: "7.0"

  RedisNumNodeGroups:
    Type: Number
    Default: 1

  RedisReplicasPerNodeGroup:
    Type: Number
    Default: 0

  RedisMultiAZEnabled:
    Type: String
    AllowedValues:
    - "true"
    - "false"
    Default: "false"

  RedisSnapshotRetentionLimit:
    Type: Number
    Default: 5

  RedisLogFormat:
    Type: String
    Default: json

  RedisLogType:
    Type: String
    Default: slow-log

  RedisLogRetentionDays:
    Type: Number
    Default: 90

  RedisCacheLogsEnabled:
    Type: String
    AllowedValues:
    - "true"
    - "false"
    Default: "false"

  # ---------------------------------------------------------------------------
  # Lambda (REQUIRED — S3 bucket differs per account)
  # ---------------------------------------------------------------------------
  LambdaS3BucketName:
    Type: String
    Description: S3 bucket holding Lambda deployment zip.
    Default: ""

  LambdaCodeKeyName:
    Type: String
    Default: ""
    Description: S3 key for Lambda code zip.

  # Lambda config (safe defaults — same across environments)
  LambdaHandler:
    Type: String
    Default: ail_connect_adapter.handler.lambda_handler

  LambdaRuntime:
    Type: String
    Default: python3.12

  LambdaTimeout:
    Type: Number
    Default: 60

  LambdaArchitecture:
    Type: String
    Default: x86_64

  LambdaMemorySize:
    Type: Number
    Default: 512

  LambdaTracing:
    Type: String
    Default: Active

  LambdaDescription:
    Type: String
    Default: AIL Colleague Assist interaction stream lambda

  LogRetentionInDays:
    Type: Number
    Default: 30
    AllowedValues:
    - 7
    - 14
    - 30
    - 90
    - 365
    Description: "CloudWatch log retention. dev/sit: 30 | uat: 90 | prod: 365"

  # ---------------------------------------------------------------------------
  # Lambda environment variable defaults (same across environments)
  # ---------------------------------------------------------------------------
  ConnectTimeoutSeconds:
    Type: Number
    Default: 2

  SocketTimeoutSeconds:
    Type: Number
    Default: 2

  SessionTtlSeconds:
    Type: Number
    Default: 3600

  RedisVarName:
    Type: String
    Description: SSM parameter path for Redis connection config JSON. MUST include environment (e.g., /ail/sit/network/redis/config).

  AgentCoreVarName:
    Type: String
    Description: SSM parameter path for AgentCore connection config JSON. MUST include environment (e.g., /ail/sit/network/agentcore/config).

  # ---------------------------------------------------------------------------
  # Monitoring (OPTIONAL — AgentCore log group for app-level metric filters)
  # ---------------------------------------------------------------------------
  AgentCoreLogGroupName:
    Type: String
    Default: ""
    Description: >-
      AgentCore CloudWatch log group name (auto-created by Bedrock runtime).
      e.g. /aws/bedrock-agentcore/runtime/colleague_assist_orchestrator_dev-JgFPRbFKM0
      Leave empty to skip AgentCore metric filters and alarms.

  # ---------------------------------------------------------------------------
  # SQS FIFO queue — cross-account forwarder (optional)
  # ---------------------------------------------------------------------------
  SourceAccountForwarderRoleArn:
    Type: String
    Default: ""
    Description: "ARN of the cross-account forwarder Lambda execution role. Leave empty if no cross-account access needed."


  KMSRoleName:
    Type: String
    Description: IAM role that will be used as a principal for the KMS key
    Default: core-CloudformationStackAdmin

  TransitionToIADays:
    Type: Number
    Description: Days before transitioning object versions to STANDARD_IA
    Default: 30
    MinValue: 0
    MaxValue: 365

  TransitionToGlacierDays:
    Type: Number
    Description: Days before transitioning object versions to GLACIER
    Default: 365
    MinValue: 1
    MaxValue: 3650

  ExpirationDays:
    Type: Number
    Description: Days before deleting old object versions
    Default: 2555
    MinValue: 1
    MaxValue: 10950

Conditions:
  HasPermissionsBoundary: !Not [!Equals [!Ref PermissionsBoundaryArn, ""]]
  HasAgentCoreLogGroup: !Not [!Equals [!Ref AgentCoreLogGroupName, ""]]
  HasCrossAccountForwarder: !Not [!Equals [!Ref SourceAccountForwarderRoleArn, ""]]
  # Both modes create the artifacts bucket/KMS key, so no condition guards them.
  # Only the application services are gated.
  DeployApplicationServices: !Not [!Equals [!Ref DeploymentMode, BucketOnly]]
  DeployApplicationServicesAndHasAgentCoreLogGroup: !And [!Condition DeployApplicationServices, !Condition HasAgentCoreLogGroup]
  DeployApplicationServicesAndHasCrossAccountForwarder: !And [!Condition DeployApplicationServices, !Condition HasCrossAccountForwarder]

Resources:
  # ---------------------------------------------------------------------------
  # Security groups created in this parent stack and stored in SSM
  # ---------------------------------------------------------------------------
  ArtifactsKmsKey:
    Type: AWS::KMS::Key
    # The bucket created below cannot be read without this key. Retain so an
    # accidental stack delete never orphans the artifacts.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: !Sub "KMS key for ail-assist artifacts bucket in ${Environment}"
      EnableKeyRotation: true
      KeySpec: SYMMETRIC_DEFAULT
      KeyUsage: ENCRYPT_DECRYPT
      KeyPolicy:
        Version: '2012-10-17'
        Id: ail-assist-artifacts-s3
        Statement:
        - Sid: EnableIAMUserPermissions
          Effect: Allow
          Principal:
            AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root"
          Action: "kms:*"
          Resource: "*"

        - Sid: AllowKmsAdministration
          Effect: Allow
          Principal:
            AWS: !Sub "arn:aws:iam::${AWS::AccountId}:role/${KMSRoleName}"
          Action:
          - kms:Create*
          - kms:Describe*
          - kms:Enable*
          - kms:List*
          - kms:Put*
          - kms:Update*
          - kms:Revoke*
          - kms:Disable*
          - kms:Get*
          - kms:Delete*
          - kms:TagResource
          - kms:UntagResource
          - kms:ScheduleKeyDeletion
          - kms:CancelKeyDeletion
          Resource: "*"

        - Sid: AllowArtifactsKeyUsage
          Effect: Allow
          Principal:
            AWS: !Sub "arn:aws:iam::${AWS::AccountId}:role/${KMSRoleName}"
          Action:
          - kms:Encrypt
          - kms:Decrypt
          - kms:ReEncrypt*
          - kms:GenerateDataKey*
          - kms:DescribeKey
          Resource: "*"

        - Sid: AllowPersistentResourceGrants
          Effect: Allow
          Principal:
            AWS: !Sub "arn:aws:iam::${AWS::AccountId}:role/${KMSRoleName}"
          Action:
          - kms:CreateGrant
          - kms:ListGrants
          - kms:RevokeGrant
          Resource: "*"
          Condition:
            Bool:
              kms:GrantIsForAWSResource: 'true'
      Tags:
      - Key: Application
        Value: ail-assist
      - Key: Environment
        Value: !Ref Environment
      - Key: Component
        Value: KMS
      - Key: Purpose
        Value: S3-Artifacts-Encryption

  ArtifactsKmsKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub "alias/ail-assist-artifacts-s3-${Environment}"
      TargetKeyId: !Ref ArtifactsKmsKey

  ArtifactsBucket:
    Type: AWS::S3::Bucket
    # Retain: CloudFormation cannot delete a non-empty versioned bucket, and the
    # Lambda zip lives here. Delete manually if the stack is truly being retired.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "ail-assist-artifacts-${Environment}-${AWS::AccountId}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
        - BucketKeyEnabled: true
          ServerSideEncryptionByDefault:
            SSEAlgorithm: aws:kms
            KMSMasterKeyID: !GetAtt ArtifactsKmsKey.Arn
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
        - Id: TransitionOldVersionsToIA
          Status: Enabled
          NoncurrentVersionTransitions:
          - StorageClass: STANDARD_IA
            TransitionInDays: !Ref TransitionToIADays
        - Id: TransitionOldVersionsToGlacier
          Status: Enabled
          NoncurrentVersionTransitions:
          - StorageClass: GLACIER
            TransitionInDays: !Ref TransitionToGlacierDays
        - Id: DeleteExpiredVersions
          Status: Enabled
          NoncurrentVersionExpirationInDays: !Ref ExpirationDays
      # PublicAccessBlockConfiguration is enforced at organisation level.
      NotificationConfiguration:
        EventBridgeConfiguration:
          EventBridgeEnabled: true
      Tags:
      - Key: Project
        Value: AIL-ColleagueAssist
      - Key: Environment
        Value: !Ref Environment
      - Key: Purpose
        Value: LambdaDeploymentArtifacts
      - Key: DataClassification
        Value: INTERNAL
      - Key: Component
        Value: Compute

  RedisAdditionalSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Condition: DeployApplicationServices
    Properties:
      GroupDescription: !Sub "${AppName}-${Environment}-redis-additional-sg"
      VpcId: !Ref VpcIdValue
      Tags:
      - Key: Name
        Value: !Sub "${AppName}-${Environment}-redis-additional-sg"
      - Key: Application
        Value: !Ref AppName
      - Key: Environment
        Value: !Ref Environment

  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Condition: DeployApplicationServices
    Properties:
      GroupDescription: !Sub "${AppName}-${Environment}-lambda-sg"
      VpcId: !Ref VpcIdValue
      SecurityGroupEgress:
      - IpProtocol: tcp
        FromPort: 443
        ToPort: 443
        CidrIp: !Ref VpcCidrValue
        Description: HTTPS to VPC endpoints in Lambda subnets
      - IpProtocol: tcp
        FromPort: 443
        ToPort: 443
        CidrIp: 28.41.124.0/22
        Description: HTTPS to VPC endpoints in 28.41.124.0/22
      - IpProtocol: tcp
        FromPort: 443
        ToPort: 443
        CidrIp: 28.41.128.0/22
        Description: HTTPS to VPC endpoints in 28.41.128.0/22
      - IpProtocol: tcp
        FromPort: 443
        ToPort: 443
        CidrIp: 28.41.132.0/22
        Description: HTTPS to VPC endpoints in 28.41.132.0/22
      - IpProtocol: tcp
        FromPort: !Ref RedisPort
        ToPort: !Ref RedisPort
        DestinationSecurityGroupId: !Ref RedisAdditionalSecurityGroup
        Description: Redis access
      Tags:
      - Key: Name
        Value: !Sub "${AppName}-${Environment}-lambda-sg"
      - Key: Application
        Value: !Ref AppName
      - Key: Environment
        Value: !Ref Environment

  AgentCoreAdditionalSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Condition: DeployApplicationServices
    Properties:
      GroupDescription: !Sub "${AppName}-${Environment}-agentcore-additional-sg"
      VpcId: !Ref VpcIdValue
      SecurityGroupEgress:
      - IpProtocol: tcp
        FromPort: !Ref RedisPort
        ToPort: !Ref RedisPort
        DestinationSecurityGroupId: !Ref RedisAdditionalSecurityGroup
        Description: Allow AgentCore to access Redis
      - IpProtocol: tcp
        FromPort: 443
        ToPort: 443
        CidrIp: !Ref VpcCidrValue
        Description: HTTPS to VPC endpoints in Lambda subnets
      - IpProtocol: tcp
        FromPort: 443
        ToPort: 443
        CidrIp: 28.41.124.0/22
        Description: HTTPS to VPC endpoints in 28.41.124.0/22
      - IpProtocol: tcp
        FromPort: 443
        ToPort: 443
        CidrIp: 28.41.128.0/22
        Description: HTTPS to VPC endpoints in 28.41.128.0/22
      - IpProtocol: tcp
        FromPort: 443
        ToPort: 443
        CidrIp: 28.41.132.0/22
        Description: HTTPS to VPC endpoints in 28.41.132.0/22
      Tags:
      - Key: Name
        Value: !Sub "${AppName}-${Environment}-agentcore-additional-sg"
      - Key: Application
        Value: !Ref AppName
      - Key: Environment
        Value: !Ref Environment

  # ---------------------------------------------------------------------------
  # AgentCore Runtime execution role
  # ---------------------------------------------------------------------------
  AgentCoreRuntimeExecutionRole:
    Type: AWS::IAM::Role
    Condition: DeployApplicationServices
    Properties:
      RoleName: !Sub "svc-${AppName}-${Environment}-agentcore-role"
      PermissionsBoundary: !If [HasPermissionsBoundary, !Ref PermissionsBoundaryArn, !Ref "AWS::NoValue"]
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
        - Sid: AgentCoreAssumeRole
          Effect: Allow
          Principal:
            Service: bedrock-agentcore.amazonaws.com
          Action: sts:AssumeRole
          # Confused-deputy guard: without these, any AgentCore runtime in any
          # account could ask the service to assume this role.
          Condition:
            StringEquals:
              aws:SourceAccount: !Ref "AWS::AccountId"
            ArnLike:
              aws:SourceArn: !Sub "arn:aws:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:*"
      Policies:
      - PolicyName: AgentCoreRuntimeExecutionPolicy
        PolicyDocument:
          Version: "2012-10-17"
          Statement:
          - Sid: WriteLogs
            Effect: Allow
            Action:
            - logs:CreateLogGroup
            - logs:CreateLogStream
            - logs:PutLogEvents
            - logs:DescribeLogStreams
            - logs:PutResourcePolicy
            Resource:
            - !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/bedrock-agentcore/runtimes/*"
            - !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/bedrock-agentcore/runtimes/*:log-stream:*"
          - Sid: DescribeLogGroups
            Effect: Allow
            # DescribeLogGroups cannot be scoped to a single group; it is a
            # list-style call and must stay on log-group:*.
            Action:
            - logs:DescribeLogGroups
            Resource:
            - !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:*"

          # -----------------------------------------------------------------
          # Container image pull. Without these the runtime cannot start at all:
          # AgentCore pulls the agent image from ECR using this role.
          # -----------------------------------------------------------------
          - Sid: ECRImagePull
            Effect: Allow
            Action:
            - ecr:BatchGetImage
            - ecr:GetDownloadUrlForLayer
            - ecr:BatchCheckLayerAvailability
            Resource:
            - !Sub "arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/*"
          - Sid: ECRAuthToken
            Effect: Allow
            # GetAuthorizationToken is account-wide by design and cannot be scoped.
            Action:
            - ecr:GetAuthorizationToken
            Resource: "*"

          # -----------------------------------------------------------------
          # Workload identity — AgentCore mints the agent's access token through
          # these calls on every session.
          # -----------------------------------------------------------------
          - Sid: GetAgentAccessToken
            Effect: Allow
            Action:
            - bedrock-agentcore:GetWorkloadAccessToken
            - bedrock-agentcore:GetWorkloadAccessTokenForJWT
            - bedrock-agentcore:GetWorkloadAccessTokenForUserId
            Resource:
            - !Sub "arn:aws:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:workload-identity-directory/default"
            - !Sub "arn:aws:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:workload-identity-directory/default/workload-identity/*"

          # -----------------------------------------------------------------
          # Observability. Tracing and the built-in AgentCore metrics are both
          # silent failures when missing — nothing errors, data just never lands.
          # -----------------------------------------------------------------
          - Sid: XRayTracing
            Effect: Allow
            Action:
            - xray:PutTraceSegments
            - xray:PutTelemetryRecords
            - xray:GetSamplingRules
            - xray:GetSamplingTargets
            Resource: "*"
          - Sid: PutAgentCoreMetrics
            Effect: Allow
            Action: cloudwatch:PutMetricData
            Resource: "*"
            Condition:
              StringEquals:
                cloudwatch:namespace: bedrock-agentcore

          - Sid: InvokeAgentRuntime
            Effect: Allow
            Action:
            - bedrock-agentcore:InvokeAgentRuntime
            Resource:
            - !Sub "arn:aws:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:runtime/*"
          - Sid: StopAgentCoreSession
            Effect: Allow
            Action:
            - bedrock-agentcore:StopRuntimeSession
            Resource:
            - !Sub "arn:aws:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:runtime/*"
          - Sid: InvokeBedrockModels
            Effect: Allow
            Action:
            - bedrock:InvokeModel
            - bedrock:InvokeModelWithResponseStream
            - bedrock:Converse
            - bedrock:ConverseStream
            Resource:
            # The configured model IDs are EU cross-region inference profiles
            # (eu.anthropic.claude-*). Such a profile routes the request to a
            # foundation model in ANY of the profile's member regions, so the
            # foundation-model ARN must not be pinned to ${AWS::Region} or the
            # call fails with AccessDenied the moment it routes elsewhere.
            - "arn:aws:bedrock:*::foundation-model/*"
            - !Sub "arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/*"
            - !Sub "arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:application-inference-profile/*"

          # This stack creates a Guardrail and publishes its ID into SSM for the
          # agent to use; without ApplyGuardrail the agent cannot actually use it.
          - Sid: ApplyBedrockGuardrail
            Effect: Allow
            Action:
            - bedrock:ApplyGuardrail
            - bedrock:GetGuardrail
            Resource:
            - !Sub "arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:guardrail/*"
          - Sid: SSMParameterRead
            Effect: Allow
            Action:
            - ssm:GetParameter
            - ssm:GetParameters
            - ssm:GetParametersByPath
            Resource:
            # Every parameter this stack writes lives under /ail/<env>/. Scope to
            # the environment so a dev runtime cannot read prod configuration.
            - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/ail/${Environment}/*"
          - Sid: SecretsManagerAccess
            Effect: Allow
            Action:
            - secretsmanager:GetSecretValue
            Resource:
                  # Scoped to Redis auth secret only (C1 fix — was secret:*)
            - !GetAtt RedisProvisionedProduct.Outputs.CacheSecretArn
          - Sid: KMSDecryptBedrockGuardrail
            Effect: Allow
            Action:
            - kms:Decrypt
            - kms:DescribeKey
            Resource:
                  # Scoped to Bedrock Guardrail KMS key only (C2 fix — was key/*)
            - !GetAtt BedrockGuardrailKmsKey.Arn
          - Sid: KMSDecryptViaSecretsManager
            Effect: Allow
            Action:
            - kms:Decrypt
            - kms:DescribeKey
            Resource:
                  # Allow decrypt for any key, but ONLY when accessed through
                  # Secrets Manager (covers Redis secret's encryption key which
                  # is created by the Service Catalog product — ARN not available here)
            - !Sub "arn:aws:kms:${AWS::Region}:${AWS::AccountId}:key/*"
            Condition:
              StringEquals:
                kms:ViaService: !Sub "secretsmanager.${AWS::Region}.amazonaws.com"
      Tags:
      - Key: Application
        Value: !Ref AppName
      - Key: Environment
        Value: !Ref Environment

  # ---------------------------------------------------------------------------
  # KMS Key for Bedrock Guardrail encryption
  # ---------------------------------------------------------------------------
  BedrockGuardrailKmsKey:
    Type: AWS::KMS::Key
    Condition: DeployApplicationServices
    Properties:
      Description: !Sub "KMS key for Bedrock Guardrail encryption - ${AppName}-${Environment}"
      EnableKeyRotation: true
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
        - Sid: Enable IAM User Permissions
          Effect: Allow
          Principal:
            AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root"
          Action: "kms:*"
          Resource: "*"
        - Sid: Allow Bedrock to use the key
          Effect: Allow
          Principal:
            Service: bedrock.amazonaws.com
          Action:
          - "kms:Decrypt"
          - "kms:GenerateDataKey"
          - "kms:DescribeKey"
          Resource: "*"
      Tags:
      - Key: Name
        Value: !Sub "${AppName}-${Environment}-bedrock-guardrail-key"
      - Key: Application
        Value: !Ref AppName
      - Key: Environment
        Value: !Ref Environment

  BedrockGuardrailKmsKeyAlias:
    Type: AWS::KMS::Alias
    Condition: DeployApplicationServices
    Properties:
      AliasName: !Sub "alias/ail-${Environment}-bedrock-guardrail"
      TargetKeyId: !Ref BedrockGuardrailKmsKey

  # ---------------------------------------------------------------------------
  # Bedrock Guardrail (merged from colleague-assist-bedrock-guardrail-cfn-template.yaml)
  # Content filtering, PII masking and profanity detection for the complaint journey.
  # Standalone template's EnvironmentName parameter maps onto this stack's Environment.
  # ---------------------------------------------------------------------------
  BedrockGuardrail:
    Type: AWS::Bedrock::Guardrail
    Condition: DeployApplicationServices
    DependsOn:
    - BedrockGuardrailKmsKey
    Properties:
      Name: !Sub "${AppName}-${Environment}-bedrock-guardrail"
      Description: !Sub "Barclays AIL Complaint Journey - Content Guardrail (${Environment})"
      BlockedInputMessaging: "Your input has been blocked by Barclays AI safety guardrails. Please revise and try again."
      BlockedOutputsMessaging: "This content has been blocked by Barclays AI safety guardrails."
      KmsKeyArn: !GetAtt BedrockGuardrailKmsKey.Arn

      # Content Policy Configuration
      ContentPolicyConfig:
        FiltersConfig:
          # Hate speech filter
        - Type: HATE
          InputStrength: HIGH
          InputAction: NONE
          OutputStrength: HIGH
          OutputAction: NONE

          # Insults filter
        - Type: INSULTS
          InputStrength: HIGH
          InputAction: NONE
          OutputStrength: HIGH
          OutputAction: NONE

          # Sexual content filter
        - Type: SEXUAL
          InputStrength: HIGH
          InputAction: NONE
          OutputStrength: HIGH
          OutputAction: NONE

          # Violence filter
        - Type: VIOLENCE
          InputStrength: HIGH
          InputAction: NONE
          OutputStrength: HIGH
          OutputAction: NONE

          # Misconduct filter
        - Type: MISCONDUCT
          InputStrength: HIGH
          InputAction: NONE
          OutputStrength: HIGH
          OutputAction: NONE

          # Prompt attack filter (input only - OutputStrength set to NONE as required by schema)
        - Type: PROMPT_ATTACK
          InputStrength: HIGH
          InputAction: NONE
          OutputStrength: NONE

      # Word Policy Configuration (Profanity)
      WordPolicyConfig:
        ManagedWordListsConfig:
        - Type: PROFANITY
          InputAction: NONE
          OutputAction: BLOCK

      # Sensitive Information Policy Configuration
      SensitiveInformationPolicyConfig:
        # PII Entities Configuration (20 types)
        PiiEntitiesConfig:
          # Personal identifiers
        - Type: NAME
          Action: ANONYMIZE
          InputAction: ANONYMIZE
          OutputAction: ANONYMIZE
        - Type: PHONE
          Action: ANONYMIZE
          InputAction: ANONYMIZE
          OutputAction: ANONYMIZE
        - Type: EMAIL
          Action: ANONYMIZE
          InputAction: ANONYMIZE
          OutputAction: ANONYMIZE
        - Type: ADDRESS
          Action: ANONYMIZE
          InputAction: ANONYMIZE
          OutputAction: ANONYMIZE
        - Type: AGE
          Action: ANONYMIZE
          InputAction: ANONYMIZE
          OutputAction: ANONYMIZE
        - Type: USERNAME
          Action: ANONYMIZE
          InputAction: ANONYMIZE
          OutputAction: ANONYMIZE
        - Type: PASSWORD
          Action: ANONYMIZE
          InputAction: ANONYMIZE
          OutputAction: ANONYMIZE

          # Identification documents
        - Type: DRIVER_ID
          Action: ANONYMIZE
          InputAction: ANONYMIZE
          OutputAction: ANONYMIZE
        - Type: LICENSE_PLATE
          Action: ANONYMIZE
          InputAction: ANONYMIZE
          OutputAction: ANONYMIZE
        - Type: VEHICLE_IDENTIFICATION_NUMBER
          Action: ANONYMIZE
          InputAction: ANONYMIZE
          OutputAction: ANONYMIZE

          # Financial information
          # CREDIT_DEBIT_CARD_CVV: AWS does not support input-side detection for CVV - InputEnabled set to false
        - Type: CREDIT_DEBIT_CARD_CVV
          Action: ANONYMIZE
          InputEnabled: false
          OutputAction: ANONYMIZE
        - Type: CREDIT_DEBIT_CARD_EXPIRY
          Action: ANONYMIZE
          InputAction: ANONYMIZE
          OutputAction: ANONYMIZE
        - Type: CREDIT_DEBIT_CARD_NUMBER
          Action: ANONYMIZE
          InputAction: ANONYMIZE
          OutputAction: ANONYMIZE
        - Type: PIN
          Action: ANONYMIZE
          InputAction: ANONYMIZE
          OutputAction: ANONYMIZE
        - Type: INTERNATIONAL_BANK_ACCOUNT_NUMBER
          Action: ANONYMIZE
          InputAction: ANONYMIZE
          OutputAction: ANONYMIZE
        - Type: SWIFT_CODE
          Action: ANONYMIZE
          InputAction: ANONYMIZE
          OutputAction: ANONYMIZE

          # Network and UK-specific identifiers
        - Type: IP_ADDRESS
          Action: ANONYMIZE
          InputAction: ANONYMIZE
          OutputAction: ANONYMIZE
        - Type: UK_UNIQUE_TAXPAYER_REFERENCE_NUMBER
          Action: ANONYMIZE
          InputAction: ANONYMIZE
          OutputAction: ANONYMIZE
        - Type: UK_NATIONAL_INSURANCE_NUMBER
          Action: ANONYMIZE
          InputAction: ANONYMIZE
          OutputAction: ANONYMIZE
        - Type: UK_NATIONAL_HEALTH_SERVICE_NUMBER
          Action: ANONYMIZE
          InputAction: ANONYMIZE
          OutputAction: ANONYMIZE

        # Custom Regex Patterns for UK-specific sensitive data (4 patterns)
        RegexesConfig:
          # UK Sort Code (format: XX-XX-XX or XX XX XX or XXXXXX)
        - Name: UK_SORT_CODE
          Pattern: '\b\d{2}[- ]?\d{2}[- ]?\d{2}\b'
          Description: UK bank sort code
          Action: ANONYMIZE
          InputAction: ANONYMIZE
          OutputAction: ANONYMIZE

          # UK IBAN (format: GBXX XXXX XXXX XXXX XXXX XX)
        - Name: UK_IBAN
          Pattern: '\bGB\d{2}[A-Z]{4}\d{14}\b'
          Description: UK International Bank Account Number
          Action: ANONYMIZE
          InputAction: ANONYMIZE
          OutputAction: ANONYMIZE

          # UK NHS Number (format: XXX XXX XXXX or XXX-XXX-XXXX)
        - Name: UK_NHS_NUMBER
          Pattern: '\b\d{3}[\s\-]?\d{3}[\s\-]?\d{4}\b'
          Description: UK National Health Service number
          Action: ANONYMIZE
          InputAction: ANONYMIZE
          OutputAction: ANONYMIZE

          # UK Postcode (format: A9A 9AA or A99 9AA, etc.)
        - Name: UK_POSTCODE
          Pattern: '\b[A-Z]{1,2}[0-9][0-9A-Z]?\s*[0-9][A-Z]{2}\b'
          Description: UK postal code
          Action: ANONYMIZE
          InputAction: ANONYMIZE
          OutputAction: ANONYMIZE

      Tags:
      - Key: Environment
        Value: !Ref Environment
      - Key: Component
        Value: BedrockGuardrail
      - Key: Application
        Value: !Ref AppName

  GuardrailIdSsmParameter:
